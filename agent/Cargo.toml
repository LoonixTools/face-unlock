# face-unlock-agent: the part in the user's session. It unlocks the lock
# screen by face, shows the bubble, and is face-unlock's own lock screen.
[package]
name = "face-unlock-agent"
description = "The face-unlock agent in the user's session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "face-unlock-agent"
path = "src/main.rs"

[dependencies]
face-unlock = { path = ".." }
libc = "0.2"
serde_json = "1"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zbus = "5"
