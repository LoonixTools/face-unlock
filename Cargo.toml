[workspace]
members = ["vision", "daemon", "pam", "agent", "gui"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LoonixTools/face-unlock"

# The command line and what every other part shares: paths, settings files,
# translations, the way to the daemon, the PAM files.
[package]
name = "face-unlock"
description = "Face ID for Linux: the lock screen, sudo and admin prompts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "face_unlock"
path = "src/lib.rs"

[[bin]]
name = "face-unlock"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

# The networks run on every frame. Unoptimized they are ten times slower,
# which makes a debug daemon useless for trying things out.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.face-unlock-vision]
opt-level = 3

# Rune patches these crates in its own workspace, and a dependency's [patch]
# never reaches the workspace that uses it. Same rev as rune in gui/Cargo.toml.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
parley_engine = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
accesskit_windows = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
accesskit_macos = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
