name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: build, tests and clippy
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: |
          pacman -Syu --noconfirm --needed git base-devel rust pkgconf \
            pam libxkbcommon systemd-libs scdoc desktop-file-utils

      - uses: actions/checkout@v7

      # The liveness cues against synthetic heads and photos, the face store,
      # the PAM file editing, the settings files and the translations; then
      # clippy.
      - run: make check

      - name: Build everything and the man page
        run: make build
