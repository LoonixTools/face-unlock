<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- the tile, as Waypointer's: graphite with a soft shine on top -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3B40"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- the glyph: white with a little shade, like the glove -->
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="58" y1="58" x2="198" y2="198">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D2D2D8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- the frame's four corners -->
  <g fill="none" stroke="url(#glyph)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 92 V80 Q58 58 80 58 H92"/>
    <path d="M164 58 H176 Q198 58 198 80 V92"/>
    <path d="M198 164 V176 Q198 198 176 198 H164"/>
    <path d="M92 198 H80 Q58 198 58 176 V164"/>
  </g>

  <!-- the face -->
  <g fill="none" stroke="url(#glyph)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M101 99 V113"/>
    <path d="M155 99 V113"/>
    <path d="M128 101 V127 Q128 135 120 135"/>
    <path d="M103 156 Q128 174 153 156"/>
  </g>
</svg>
