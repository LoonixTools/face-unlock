# pam_face_unlock.so: lets sudo, admin prompts and lock screens ask the
# daemon for a face. Kept small: no translations but its own, no runtime.
[package]
name = "pam-face-unlock"
description = "PAM module for face-unlock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "pam_face_unlock"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
serde_json = "1"
