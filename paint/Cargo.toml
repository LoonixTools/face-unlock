# face-unlock-paint: how the bubble and face-unlock's own lock screen look,
# drawn with tiny-skia. The agent puts them on screen, the window shows them
# as a preview of the settings.
[package]
name = "face-unlock-paint"
description = "The bubble and the lock screen of face-unlock, drawn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
face-unlock = { path = ".." }
libc = "0.2"
tiny-skia = "0.11"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
